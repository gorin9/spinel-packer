name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tool:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.1', '3.3']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install rake --no-document
      - run: rake test
      - run: gem build spinel-packer.gemspec
